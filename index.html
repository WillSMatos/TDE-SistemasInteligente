<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas V2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Gerenciador de Tarefas (V2)</h2>
        
        <div class="filters">
            <button onclick="setFilter('all')" id="btn-all" class="active">Todas</button>
            <button onclick="setFilter('pending')" id="btn-pending">Pendentes</button>
            <button onclick="setFilter('completed')" id="btn-completed">Concluídas</button>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Digite a nova tarefa..." onkeypress="handleKeyPress(event)">
            <select id="priorityInput">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>
            <button onclick="addTask()">Cadastrar</button>
        </div>

        <ul id="taskList">
            <!-- As tarefas aparecerão aqui -->
        </ul>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
